name: Backend tests

on:
  push:
    branches:
      - fix/jobstore-atomic-tests
      - feature/magichour-video-generation
  pull_request:
    branches:
      - main
      - fix/jobstore-atomic-tests
      - feature/magichour-video-generation
    paths:
      - "backend/**"
      - "index.html"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Durable Object tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Check frontend JavaScript syntax
        run: |
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const html = readFileSync('../index.html', 'utf8'); const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]; if (!scripts.length) throw new Error('No inline JavaScript found'); writeFileSync('/tmp/capital-ai-studio-inline.js', scripts.map(match => match[1]).join('\\n'));"
          node --check /tmp/capital-ai-studio-inline.js
      - name: Run tests
        run: npm test
